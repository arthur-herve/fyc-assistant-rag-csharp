# Configuration du service IA : quels modèles sont servis, et par quel moteur.
# L'application ne connaît que les alias, les noms entre crochets : llama3-2-3b dans
# [generation.llama3-2-3b], alors que le modèle Ollama s'appelle llama3.2:3b.
#
# Les modèles Ollama doivent être téléchargés avant usage. Ceux qu'utilise le cours :
#   ollama pull bge-m3
#   ollama pull llama3.2:3b
# Les noms exacts sont à vérifier sur https://ollama.com/library

[server]
host = "127.0.0.1"   # mettre "0.0.0.0" pour servir d'autres machines du réseau
port = 8100

[defaults.ollama]
base_url = "http://127.0.0.1:11434"

[defaults.openai-compatible]
base_url = "http://127.0.0.1:1234/v1"   # port de LM Studio, 8080 pour llama.cpp

# ---------------------------------------------------------------------------
# Modèles d'embeddings
# ---------------------------------------------------------------------------

[embedding.hashing]
backend = "hashing"
description = "Hors-ligne, sans modèle appris (sac de mots haché). Plancher de comparaison."
dimension = 256

[embedding.hashing-512]
backend = "hashing"
description = "Même principe que `hashing`, en 512 dimensions."
dimension = 512

[embedding.hashing-stem4]
backend = "hashing"
description = "Même dimension que `hashing`, mais d'autres vecteurs : les mots y sont réduits à leurs 4 premières lettres."
dimension = 256
stem = 4

[embedding.all-minilm]
backend = "ollama"
description = "384 dim., ~46 Mo, entraîné surtout en anglais : attendu faible sur un corpus français."
model = "all-minilm"

[embedding.nomic]
backend = "ollama"
description = "768 dim., ~270 Mo, exige des préfixes de tâche."
model = "nomic-embed-text"
query_prefix = "search_query: "
document_prefix = "search_document: "

[embedding.mxbai]
backend = "ollama"
description = "1024 dim., ~670 Mo, préfixe d'instruction côté requête uniquement."
model = "mxbai-embed-large"
query_prefix = "Represent this sentence for searching relevant passages: "

[embedding.bge-m3]
backend = "ollama"
description = "1024 dim., ~1,2 Go, multilingue."
model = "bge-m3"

# Optionnels : ces modèles demandent d'abord pip install -r requirements-ai-optional.txt
[embedding.st-multilingual-minilm]
backend = "sentence-transformers"
description = "384 dim., multilingue, exécuté par PyTorch sur CPU."
model = "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"

[embedding.st-e5-small]
backend = "sentence-transformers"
description = "384 dim., multilingue, exige les préfixes query/passage."
model = "intfloat/multilingual-e5-small"
query_prefix = "query: "
document_prefix = "passage: "

# ---------------------------------------------------------------------------
# Modèles de génération
# ---------------------------------------------------------------------------

[generation.extractive]
backend = "extractive"
description = "Hors-ligne et déterministe : recopie la phrase la plus proche et la cite."

[generation.extractive-bruite]
backend = "extractive"
description = "Hors-ligne, simule un modèle imparfait : réponses variables, citations oubliées."
citation_failure_rate = 0.3
randomize = true
model_id = "extractive-bruite"

[generation.extractive-variante]
backend = "extractive"
description = "Hors-ligne et déterministe : comme `extractive`, mais choisit pour certaines questions une autre phrase, toujours citée."
citation_failure_rate = 0.0
randomize = true
default_seed = 1
model_id = "extractive-variante"

[generation.extractive-bavard]
backend = "extractive"
description = "Hors-ligne et déterministe : comme `extractive`, mais la réponse citée est précédée d'un raisonnement en anglais."
preamble = "Okay, let me check the documents. The user is asking a question, and the answer should be in the passages. First, I need to find the sentence that answers it."
model_id = "extractive-bavard"

[generation.gemma3-1b]
backend = "ollama"
description = "~0,8 Go. Tourne sur presque tout, qualité limitée."
model = "gemma3:1b"

# Pour les modèles qwen3, le mode réflexion reste activé (think = true) : Ollama renvoie
# alors le raisonnement à part, et le service ne garde que la réponse. La réflexion a son
# propre budget de jetons (thinking_tokens), qui doit suivre la longueur du prompt. Avec
# 4 passages de 800 caractères, qwen3:4b réfléchit sur environ 2 300 jetons, et avec un
# budget de 1 200 la réponse revient vide 4 fois sur 10 (mesuré avec Ollama 0.34).
# C'est une particularité du modèle : elle se règle ici, jamais dans l'application.
[generation.qwen3-1b7]
backend = "ollama"
description = "~1,4 Go. Réflexion activée et écartée, budget séparé."
model = "qwen3:1.7b"
think = true
thinking_tokens = 2500

[generation.llama3-2-3b]
backend = "ollama"
description = "~2 Go. Bon compromis sur un portable récent."
model = "llama3.2:3b"

[generation.qwen3-4b]
backend = "ollama"
description = "~2,5 Go. Réflexion activée et écartée, budget séparé : 30 à 50 s par réponse sur GPU."
model = "qwen3:4b"
think = true
thinking_tokens = 3000

[generation.gemma3-4b]
backend = "ollama"
description = "~3,3 Go."
model = "gemma3:4b"

[generation.mistral-7b]
backend = "ollama"
description = "~4,1 Go. Confortable avec 16 Go de RAM ou un GPU de 6 Go et plus."
model = "mistral:7b"

# Exemple de serveur compatible OpenAI (LM Studio, llama.cpp, vLLM)
[generation.lmstudio]
backend = "openai-compatible"
description = "Modèle chargé dans LM Studio (renseigner le nom exact)."
model = "nom-du-modele-charge"
