name: tests

on:
  push:
  pull_request:

jobs:
  csharp:
    name: application C# · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests (sans IA, sans réseau) — fil rouge et exemple S1.3
        run: dotnet test FycAssistantRag.sln --nologo
      - name: Kit S2.2 — rouge au départ, vert avec la solution
        shell: bash
        run: |
          cd exercices/s2.2-coeur-metier/depart
          dotnet build --nologo                                    # le kit de départ doit compiler…
          if dotnet test --nologo --no-build > /dev/null 2>&1; then echo "le kit de départ ne doit pas être vert" && exit 1; fi   # … et être rouge
          cp ../solution/*.cs Coeur/
          dotnet test --nologo
      - name: Cas pratique S5.1 — la version de départ compile
        run: dotnet build cas-pratique/depart --nologo
  python:
    name: service IA Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du service IA
        run: python -m unittest discover -s tests_python -t . -v
