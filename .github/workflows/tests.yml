name: tests

on:
  push:
  pull_request:

jobs:
  csharp:
    name: application C# · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests (sans IA, sans réseau)
        run: dotnet test --nologo
  python:
    name: service IA Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests du service IA
        run: python -m unittest discover -s tests_python -t . -v
