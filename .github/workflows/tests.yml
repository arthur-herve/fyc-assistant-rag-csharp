name: tests

on:
  push:
  pull_request:

jobs:
  csharp:
    name: application C# · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilation (avertissements en erreurs) — fil rouge et exemple S1.3
        run: dotnet build FycAssistantRag.sln -warnaserror --nologo
      - name: Tests (sans IA, sans réseau) — fil rouge
        run: dotnet test FycAssistantRag.sln --no-build --nologo
  python:
    name: Python ${{ matrix.python }} (service IA, outil d'import) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]   # la version minimale annoncée dans docs/installation.md, et une récente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests du service IA et de l'outil d'import
        run: python -m unittest discover -s tests_python -t . -v
  demonstration:
    name: démonstration hors ligne · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compilation de l'application
        run: dotnet build src/Assistant.Cli --nologo
      - name: Service IA hors ligne, index, puis une question sur le corpus Solvéo
        shell: bash
        run: |
          # Le service IA écoute sur un port libre, choisi par le système, et AI_SERVICE_URL donne son adresse à l'application.
          PORT=$(python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1], end='')")
          export AI_SERVICE_URL="http://127.0.0.1:$PORT"
          python -m ai_service --port "$PORT" > service-ia.log 2>&1 &
          SERVICE=$!
          trap 'kill "$SERVICE"' EXIT
          curl -fs --retry 30 --retry-delay 1 --retry-connrefused "$AI_SERVICE_URL/health" > /dev/null || { echo "Le service IA ne répond pas sur $AI_SERVICE_URL."; cat service-ia.log; exit 1; }
          dotnet run --project src/Assistant.Cli --no-build -- index
          dotnet run --project src/Assistant.Cli --no-build -- ask "Combien de jours de télétravail par semaine ?" | tee reponse.txt
          grep -q -F "statut=answered" reponse.txt || { echo "La question devait recevoir une réponse."; exit 1; }
