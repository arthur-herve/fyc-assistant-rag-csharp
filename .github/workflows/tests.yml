name: tests

on:
  push:
  pull_request:

jobs:
  csharp:
    name: application C# · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilation (avertissements en erreurs) — fil rouge et exemple S1.3
        run: dotnet build FycAssistantRag.sln -warnaserror --nologo
      - name: Tests (sans IA, sans réseau) — fil rouge
        run: dotnet test FycAssistantRag.sln --no-build --nologo
  python:
    name: Python ${{ matrix.python }} (service IA, outil d'import) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]   # la version minimale annoncée dans docs/installation.md, et une récente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests du service IA et de l'outil d'import
        run: python -m unittest discover -s tests_python -t . -v
  demonstration:
    name: démonstration hors ligne · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compilation de l'application
        run: dotnet build src/Assistant.Cli --nologo
      - name: Service IA hors ligne, index, puis une question sur le corpus Solvéo
        shell: bash
        run: |
          # Le service IA écoute sur un port libre, choisi par le système, et AI_SERVICE_URL donne son adresse à l'application.
          PORT=$(python -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1], end='')")
          export AI_SERVICE_URL="http://127.0.0.1:$PORT"
          python -m ai_service --port "$PORT" > service-ia.log 2>&1 &
          SERVICE=$!
          trap 'kill "$SERVICE"' EXIT
          curl -fs --retry 30 --retry-delay 1 --retry-connrefused "$AI_SERVICE_URL/health" > /dev/null || { echo "Le service IA ne répond pas sur $AI_SERVICE_URL."; cat service-ia.log; exit 1; }
          dotnet run --project src/Assistant.Cli --no-build -- index
          dotnet run --project src/Assistant.Cli --no-build -- ask "Combien de jours de télétravail par semaine ?" | tee reponse.txt
          grep -q -F "statut=answered" reponse.txt || { echo "La question devait recevoir une réponse."; exit 1; }
  exercice:
    name: exercice S2.3 — rouge au départ, vert avec la correction
    # Sur la branche de départ seulement : là où l'exercice est fait, le rouge attendu n'existe plus.
    if: github.ref_name == 'etape/s2.3' || github.base_ref == 'etape/s2.3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tout l'historique, avec les tags des corrections
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests attendus, restaurés comme le dit l'énoncé
        run: git restore --source corrige/s2.3 -- tests/Assistant.Tests/HttpContractTests.cs tests/Assistant.Tests/AiServiceResponseTests.cs tests/Assistant.Tests/CliAskTests.cs
      - name: Rouge attendu — la compilation ou les tests échouent
        run: |
          # Les paquets d'abord, pour qu'un échec de téléchargement ne passe pas pour le rouge attendu.
          dotnet restore FycAssistantRag.sln
          # Les erreurs de compilation attendues ne doivent pas s'afficher en annotations sur la page du run.
          echo "::remove-matcher owner=csc::"
          if dotnet build FycAssistantRag.sln -warnaserror --nologo && dotnet test FycAssistantRag.sln --no-build --nologo; then
            echo "Les tests attendus passent avant la solution : le départ ne laisse plus rien à écrire."
            exit 1
          fi
      - name: Solution de la correction — src/
        # Le dossier entier, cette fois : src/ devient celui de la correction, y compris pour les fichiers qu'elle retire.
        run: git restore --source corrige/s2.3 -- src/
      - name: Vert attendu — tout passe, documents du départ compris
        run: |
          dotnet build FycAssistantRag.sln -warnaserror --nologo
          dotnet test FycAssistantRag.sln --no-build --nologo
