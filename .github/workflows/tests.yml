name: tests

on:
  push:
  pull_request:

jobs:
  csharp:
    name: exemple S1.3 en C# · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compilation (avertissements en erreurs) — exemple S1.3
        run: dotnet build exemples/s1.3-transfert-naif -warnaserror --nologo
  python:
    name: Python ${{ matrix.python }} (service IA, outil d'import) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]   # la version minimale annoncée dans docs/installation.md, et une récente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests du service IA et de l'outil d'import
        run: python -m unittest discover -s tests_python -t . -v
